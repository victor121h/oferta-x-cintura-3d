    (function() {
        'use strict';

        const CONFIG = {

            SKIP_URL: 'https://vsl.rabinorony.com.br/'

        const SUPABASE = {
            URL: 'https://qqlakdpgllrjhesxidqj.supabase.co',
            KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxbGFrZHBnbGxyamhlc3hpZHFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDk3Njk2MTMsImV4cCI6MjA2NTM0NTYxM30.Hg0sj9og6dys3PdWQdH-3XJL7ySZ2X6FF1w3KgNlnVw',
            TABLE: 'meisterpages_analytics'
        };

        const state = {
            ctaRevealed: false,
            seconds: 0,
            sessionId: sessionStorage.getItem('mp_session') || crypto.randomUUID(),
            visitorId: localStorage.getItem('mp_visitor') || 'v_' + Math.random().toString(36).substr(2, 9)
        };


        sessionStorage.setItem('mp_session', state.sessionId);
        localStorage.setItem('mp_visitor', state.visitorId);

        const track = (event) => {
            fetch(`${SUPABASE.URL}/rest/v1/${SUPABASE.TABLE}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'apikey': SUPABASE.KEY,
                    'Authorization': `Bearer ${SUPABASE.KEY}`,
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify({
                    session_id: state.sessionId,
                    visitor_id: state.visitorId,
                    event_type: event,
                    event_data: {
                        page_url: location.href,
                        seconds: state.seconds,
                        video_id: 'UPSELL_CJP'
                    }
                }),
                keepalive: true
            }).catch(() => {});
        };

        track('upsell_view');

        const revealCTA = () => {
            if (state.ctaRevealed) return;
            state.ctaRevealed = true;
            document.getElementById('cta-upsell').href = CONFIG.UPSELL_URL;
            document.getElementById('cta-section').classList.add('visible');
            track('upsell_cta_revealed');
            // Facebook Pixel - ViewContent no pitch
            if (typeof fbq === 'function') {
                fbq('track', 'ViewContent', {
                    content_name: 'UPSELL_CJP',
                    content_category: 'Upsell Pitch'
                });
            }
        };

        // Load player
        const s = document.createElement('script');
        s.src = 'https://scripts.converteai.net/40eff44f-f7c6-4321-a7c6-b39c3f353230/players/682f5e3859c03765ce85b667/v4/player.js';
        s.async = true;
        document.head.appendChild(s);

        // Player events
        document.addEventListener('player:ready', (e) => {
            const player = e.detail?.player || document.querySelector('vturb-smartplayer');
            if (player) {
                player.addEventListener('timeupdate', (ev) => {
                    state.seconds = Math.floor(ev.detail?.currentTime || player.currentTime || 0);
                    if (state.seconds >= CONFIG.PITCH_SECOND) revealCTA();
                });
                player.addEventListener('ended', () => { revealCTA(); track('upsell_complete'); });
            }
        });

        document.getElementById('cta-upsell')?.addEventListener('click', () => track('upsell_clicked'));
        document.getElementById('skip-upsell')?.addEventListener('click', (e) => {
            e.preventDefault();
            track('upsell_skipped');
            location.href = CONFIG.SKIP_URL;
        });

        // Fallback 60s
        setTimeout(revealCTA, 60000);

        // Admin: DDD
        let k = '';
        document.addEventListener('keydown', (e) => {
            k += e.key.toUpperCase();
            if (k.includes('DDD')) { revealCTA(); k = ''; }
            setTimeout(() => k = '', 1000);
        });
    })();
